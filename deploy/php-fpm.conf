; =============================================================================
; The TOEFL House — PHP-FPM pool (reference)
; =============================================================================
; Provider-neutral reference pool for the production deployment. Install to
; /etc/php/8.2/fpm/pool.d/toefl-house.conf (adjust the PHP version prefix to
; your distribution) and deploy/opcache.ini into /etc/php/8.2/fpm/conf.d/. The app is a synchronous modular monolith: no queue
; workers, no scheduler, no long-lived processes — a standard FPM pool is the
; entire PHP runtime. Workers are short-lived request handlers, so a normal
; deployment reload (SIGUSR2 for zero-downtime, or a graceful restart) is all
; that is needed; there is no separate worker process to supervise.
; =============================================================================

[toefl-house]
user = www-data
group = www-data

listen = /run/php/php8.2-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Sizing for a small-to-medium employee console. Start conservative; scale by
; observed load. pm.max_srlar_workers * listen.queue should absorb bursts.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Per-request limits. The app is CPU-light (no rendering farms, no large
; imports); these are generous defaults.
request_terminate_timeout = 60s
request_slowlog_timeout = 10s
slowlog = /var/log/php/toefl-house-slow.log

; Security: run with minimal privileges, no shell access.
;
; NOTE: opcache settings deliberately do NOT live in this file. They are
; PHP_INI_SYSTEM entries, read once when the extension initialises in the FPM
; master; a pool section accepts only its own directives and REJECTS the file
; outright (`php-fpm -t`: "unknown entry 'opcache.enable'", exit 78), which
; leaves FPM unable to start at all. Install deploy/opcache.ini into the FPM
; conf.d directory instead, and reload the pool after each release because
; validate_timestamps=0 means opcache only re-reads files on restart.
security.limit_extensions = .php
catch_workers_output = yes

; Logging
access.log = /var/log/php/toefl-house-access.log
php_admin_value[error_log] = /var/log/php/toefl-house-error.log
php_admin_flag[log_errors] = on
