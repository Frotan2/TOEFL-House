; =============================================================================
; The TOEFL House — PHP-FPM opcache policy
; =============================================================================
; Install to /etc/php/<version>/fpm/conf.d/99-toefl-house-opcache.ini (any file
; in conf.d is read by both the CLI and FPM SAPI, so a per-SAPI directory keeps
; the CLI free of opcache). These belong here, not in the pool file: opcache
; entries are PHP_INI_SYSTEM and are consumed when the extension initialises in
; the master process, and an FPM pool section rejects unrecognised keys.
;
; With validate_timestamps=0 the running master never stats PHP files, so every
; deployment MUST reload PHP-FPM after switching `current` — deploy/deploy.sh
; does exactly that (systemctl reload php*-fpm) as its activation step.
; =============================================================================
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
