# =============================================================================
# The TOEFL House — one-time ACME HTTP-01 bootstrap site
# =============================================================================
# Install this *instead of* toefl-house.conf only while acquiring the first
# certificate for a new hostname. It has no TLS listener and serves exactly one
# static path: Certbot's HTTP-01 challenge below. Once certbot succeeds, replace
# it with deploy/nginx/toefl-house.conf through the ordinary deploy procedure.
#
# This is an nginx site fragment, included by the host from its `http` block
# (for example /etc/nginx/conf.d). Render it with deploy/render-nginx-config.sh
# and NGINX_SERVER_NAME before use; nginx does not expand these placeholders.
# =============================================================================

client_max_body_size 1m;

server {
    listen 80;
    listen [::]:80;
    server_name __TOEFL_SERVER_NAME__;   # rendered from NGINX_SERVER_NAME

    # Certbot --webroot -w __TOEFL_DEPLOY_ROOT__/acme-challenge writes exactly
    # $webroot/.well-known/acme-challenge/<token>. `^~` is essential: the
    # following dotfile guard would otherwise deny the required .well-known URI.
    location ^~ /.well-known/acme-challenge/ {
        root __TOEFL_DEPLOY_ROOT__/acme-challenge;
        default_type text/plain;
        try_files $uri =404;
    }

    # No application, redirect, or other dotfile path is exposed during the
    # bootstrap window. A missing challenge token must be an unambiguous 404.
    location ~ /\. {
        deny all;
    }

    location / {
        return 404;
    }
}
