name: One-shot supplied patch recovery

on:
  push:
    branches:
      - arena/01a07c87-toefl-house

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message != 'recover: publish supplied patch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/01a07c87-toefl-house

      - name: Wait for complete patch payload
        shell: bash
        run: |
          set -euo pipefail
          test -f recovery/chunk1.b64
          test -f recovery/chunk2.b64
          test -f recovery/chunk3.b64
          test -f recovery/chunk4.b64
          test -f recovery/chunk5.b64
          test -f recovery/chunk6.b64
          test -f recovery/chunk7.b64
          test -f recovery/chunk8.b64
          test -f recovery/chunk9.b64
          test -f recovery/chunk10.b64
          test -f recovery/chunk11.b64
          test -f recovery/chunk12.b64

      - name: Verify known clean base and build patch
        shell: bash
        run: |
          set -euo pipefail
          expected='521d4e7a5ee82e64fd15ad754e52816326579b94'
          git fetch origin arena/01a07c87-toefl-house
          current="$(git rev-parse origin/arena/01a07c87-toefl-house)"
          git merge-base --is-ancestor "$expected" "$current"
          cat recovery/chunk{1..12}.b64 > recovery/patch.b64
          base64 -d recovery/patch.b64 | bzip2 -d > recovery/supplied.patch
          git fetch origin "$expected"
          git checkout --detach "$expected"
          git apply --check recovery/supplied.patch

      - name: Apply, commit, and replace target history cleanly
        shell: bash
        run: |
          set -euo pipefail
          git apply --index recovery/supplied.patch
          git config user.name 'Recovery Agent'
          git config user.email 'recovery-agent@users.noreply.github.com'
          rm -f recovery/chunk{1..12}.b64 recovery/patch.b64 recovery/supplied.patch recovery/_apply_supplied_patch.yml
          git add -A
          git commit -m 'recover: publish supplied patch'
          git push --force-with-lease origin HEAD:arena/01a07c87-toefl-house
