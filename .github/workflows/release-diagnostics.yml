# TEMPORARY diagnostic workflow.
#
# Purpose: the authoritative Verification workflow is failing at
# `vendor/bin/pint --test`, but the Actions log blob store is unreachable from
# the release tooling, so the report cannot be read remotely. This workflow
# captures the Pint report, applies Pint's own fixes, and pushes both back to
# the branch so the release fix can be completed. It removes itself in the same
# commit and must not be re-added after the release is green.

name: Release diagnostics (temporary)

on:
  push:
    branches: ['arena/01a0852e-toefl-house']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    name: Diagnose Pint failure, apply fixes, push report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, dom, xml, xmlwriter, tokenizer, curl, bcmath, iconv, fileinfo, openssl, pcntl, posix
          coverage: none

      - run: composer install --no-interaction --no-progress

      # Capture the exact violation report BEFORE fixing anything.
      - name: Capture Pint report (pre-fix)
        run: |
          vendor/bin/pint --test -v > pint-report.txt 2>&1 || true

      # Apply Pint's mechanical fixes with the locked Laravel preset.
      - name: Apply Pint fixes
        run: vendor/bin/pint -v || true

      # Confirm the tree is now Pint-clean.
      - name: Re-test Pint
        run: vendor/bin/pint --test

      # Commit the fixes plus the report, drop this temp workflow, and push.
      - name: Push fixes and report, remove temp workflow
        run: |
          git config user.name "Frotan2"
          git config user.email "324640754+Frotan2@users.noreply.github.com"
          git rm -q .github/workflows/release-diagnostics.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit (Pint was already clean)."
          else
            git commit -q -m "Style: apply Pint (Laravel preset) fixes flagged by Verification on main" -m "Includes pint-report.txt (pre-fix diagnostics). Temporary diagnostic workflow removed; delete pint-report.txt once reviewed."
            git push -q origin HEAD:arena/01a0852e-toefl-house
            echo "Pushed Pint fixes."
          fi
