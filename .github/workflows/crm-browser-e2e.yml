name: CRM Browser E2E

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: crm-browser-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4.25'
  COMPOSER_VERSION: '2.10.3'
  NODE_VERSION: '22.22.3'
  NPM_VERSION: '10.9.8'

jobs:
  crm-browser-e2e:
    name: CRM Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: toefl_house_crm_e2e
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5433
      DB_DATABASE: toefl_house_crm_e2e
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      APP_ENV: production
      APP_DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:${{ env.COMPOSER_VERSION }}
          extensions: pdo_pgsql, mbstring, dom, xml, xmlwriter, tokenizer, curl, bcmath, iconv, fileinfo, openssl, pcntl, posix
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --engine-strict
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
      - run: php artisan migrate:fresh --force
      - run: php artisan db:seed --class=StandardFinanceChartSeeder --force
      - run: npm run build
      - name: Provision isolated E2E owner credentials
        shell: bash
        run: |
          E2E_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$E2E_PASSWORD"
          {
            echo "BOOTSTRAP_OWNER_NAME=CI CRM E2E Owner"
            echo "BOOTSTRAP_OWNER_BIRTHDATE=1990-01-01"
            echo "BOOTSTRAP_OWNER_USERNAME=ci.crm.e2e.owner"
            echo "BOOTSTRAP_OWNER_PASSWORD=$E2E_PASSWORD"
            echo "E2E_USERNAME=ci.crm.e2e.owner"
            echo "E2E_PASSWORD=$E2E_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Bootstrap owner account
        run: php artisan db:seed --class=FirstRunBootstrapSeeder --force
      - name: Install and warm Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium
          # Ubuntu's package starts Chromium through Snap. Force its one-time
          # confinement setup now, before Puppeteer's bounded launch timeout.
          timeout 120s /usr/bin/chromium --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --version
      - name: Start application
        run: |
          # The PHP built-in server treats its router script as the handler for
          # every request. Use Laravel's static-aware router (from public/) so
          # Vite assets are served as JS/CSS instead of being redirected through
          # the authenticated application front controller.
          (
            cd public
            php -S 127.0.0.1:8999 -t . ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php
          ) > /tmp/toefl-house-crm-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 5 http://127.0.0.1:8999/health >/dev/null \
              && curl --fail --silent --show-error --connect-timeout 2 --max-time 5 --output /dev/null --write-out '%{http_code} %{content_type}' http://127.0.0.1:8999/build/manifest.json | grep -Eq '^200 application/json'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/toefl-house-crm-e2e.log
          exit 1
      - name: Run CRM lifecycle browser E2E
        env:
          BASE_URL: http://127.0.0.1:8999
          CHROMIUM_PATH: /usr/bin/chromium
        run: node scripts/runtime/crm-browser-e2e.mjs
