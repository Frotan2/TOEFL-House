# TOEFL House — verification gates.
#
# Encodes the runtime and testing contracts so a future change cannot quietly
# regress them. See docs/RUNTIME_ENVIRONMENT_LOCK.md and
# docs/TESTING_STRATEGY_LOCK.md — the versions here must match those documents.
name: Verification

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The locked runtime. Changing these requires updating the lock documents and
# re-running the full verification chain.
env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22.22.3'
  POSTGRES_VERSION: '18.4'

jobs:
  frontend:
    name: Frontend (typecheck, build, mount)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:frontend

  static-analysis:
    name: Static analysis (Pint, PHPStan, audits)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, mbstring, dom, xml, xmlwriter, tokenizer, curl, bcmath, iconv, fileinfo, openssl, pcntl, posix
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer check-platform-reqs
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: php scripts/database-migration-audit.php
      - run: php scripts/terminology-audit.php

  backend:
    name: Backend (migrations, suite, invariants, concurrency)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: toefl_house_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: toefl_house_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, mbstring, dom, xml, xmlwriter, tokenizer, curl, bcmath, iconv, fileinfo, openssl, pcntl, posix
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --engine-strict

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verify runtime environment lock
        run: npm run verify:environment

      - name: Replay migrations
        run: php artisan migrate:fresh --force

      - name: Seed reference data
        run: php artisan db:seed --class=StandardFinanceChartSeeder --force

      - name: Database invariants
        run: npm run verify:invariants

      - name: Concurrency
        run: npm run verify:concurrency

      - name: Canonical suite
        run: vendor/bin/phpunit --testsuite Canonical --no-coverage

      - name: Backend test suite
        run: vendor/bin/phpunit --no-coverage
