# TOEFL House — verification gates.
#
# Encodes the runtime and testing contracts so a future change cannot quietly
# regress them. See docs/RUNTIME_ENVIRONMENT_LOCK.md and
# docs/TESTING_STRATEGY_LOCK.md — the versions here must match those documents.
name: Verification

on:
  push:
    branches: ['**']
  pull_request:

# The locked runtime. Changing these requires updating the lock documents and
# re-running the full verification chain.
env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '22'
  POSTGRES_VERSION: '18'

jobs:
  frontend:
    name: Frontend (typecheck, build, mount)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # ci (not install) so package-lock.json is authoritative.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Guards bundles that compile but crash on load.
      - run: npm run test:frontend

  static-analysis:
    name: Static analysis (Pint, PHPStan, audits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, mbstring, dom, xml, xmlwriter, tokenizer, curl, bcmath, iconv, fileinfo, openssl, pcntl, posix
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: composer check-platform-reqs
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      # Repository discipline: migration numbering and canonical terminology.
      - run: php scripts/database-migration-audit.php
      - run: php scripts/terminology-audit.php

  backend:
    name: Backend (migrations, suite, invariants, concurrency)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: toefl_house_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: toefl_house_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, mbstring, dom, xml, xmlwriter, tokenizer, curl, bcmath, iconv, fileinfo, openssl, pcntl, posix
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: composer install --no-interaction --no-progress
      - run: npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      # Fails fast and legibly if the runtime has drifted, rather than letting
      # it surface as confusing downstream failures.
      - name: Verify runtime environment lock
        run: npm run verify:environment

      # The full 185-migration chain must replay from zero.
      - name: Replay migrations
        run: php artisan migrate:fresh --force

      - name: Seed reference data
        run: php artisan db:seed --class=StandardFinanceChartSeeder --force

      # PostgreSQL itself must reject invalid states.
      - name: Database invariants
        run: npm run verify:invariants
        env:
          DB_DATABASE: toefl_house_test

      # Real concurrent transactions, not static inspection.
      - name: Concurrency
        run: npm run verify:concurrency
        env:
          DB_DATABASE: toefl_house_test

      # The canonical suite is the authority for new domain coverage and is
      # expected to be green; it runs first so a regression there is obvious.
      - name: Canonical suite
        run: vendor/bin/phpunit --testsuite Canonical --no-coverage

      # Includes the architecture test that locks the testing strategy.
      - name: Backend test suite
        run: vendor/bin/phpunit --no-coverage
